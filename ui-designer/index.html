<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Make the page behave properly on different display sizes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoclet UI Designer</title>

    <!-- UI Designer stylesheet. -->
    <link rel="stylesheet" href="designer.css">
</head>

<body>

    <header class="app-header">
        <h1>Sudoclet UI Designer</h1>
        <p>Design interface elements visually and generate application code.</p>
    </header>

    <main class="workspace">

        <!--
            LEFT PANEL

            For v0.2 these controls still edit Button 1 directly.

            In a later version this panel will edit whichever object is
            currently selected in the object tree or preview.
        -->
        <section class="panel controls-panel">

            <h2>Properties</h2>

            <label for="buttonText">Text</label>
            <input
                id="buttonText"
                type="text"
                value="Add Entry"
            >

            <label for="buttonX">X Offset</label>
            <input
                id="buttonX"
                type="number"
                value="105"
            >

            <label for="buttonY">Y Offset</label>
            <input
                id="buttonY"
                type="number"
                value="100"
            >

            <label for="buttonWidth">Width</label>
            <input
                id="buttonWidth"
                type="range"
                min="80"
                max="350"
                value="180"
            >
            <output id="buttonWidthValue">180</output>

            <label for="buttonHeight">Height</label>
            <input
                id="buttonHeight"
                type="range"
                min="30"
                max="150"
                value="60"
            >
            <output id="buttonHeightValue">60</output>

            <label for="cornerRadius">Corner Radius</label>
            <input
                id="cornerRadius"
                type="range"
                min="0"
                max="60"
                value="14"
            >
            <output id="cornerRadiusValue">14</output>

            <label for="fontSize">Font Size</label>
            <input
                id="fontSize"
                type="range"
                min="10"
                max="40"
                value="18"
            >
            <output id="fontSizeValue">18</output>

            <label for="backgroundColor">Background</label>
            <input
                id="backgroundColor"
                type="color"
                value="#5865f2"
            >

            <label for="textColor">Text Color</label>
            <input
                id="textColor"
                type="color"
                value="#ffffff"
            >

        </section>


        <!--
            CENTER PANEL

            previewSurface represents the finite screen/window being designed.

            JavaScript will dynamically create all of the visible elements
            inside this surface from our design model.
        -->
        <section class="panel preview-panel">

            <h2>Preview</h2>

            <div id="previewSurface" class="preview-surface">
                <!--
                    No button is hard-coded here anymore.

                    JavaScript creates the buttons and other elements from
                    the design model.
                -->
            </div>

        </section>


        <!--
            RIGHT PANEL

            This displays the actual JavaScript design model as JSON so we
            can see what is happening internally while developing the editor.
        -->
        <section class="panel code-panel">

            <h2>Design Model</h2>

            <pre id="designModel"></pre>

        </section>

    </main>

    <!-- UI Designer application code. -->
    <script src="designer.js"></script>

</body>
</html>
